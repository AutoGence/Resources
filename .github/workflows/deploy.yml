name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      # Fail loudly rather than deploying an empty site. A Worker that
      # publishes successfully with no assets is worse than a failed build.
      - name: Verify build output
        run: |
          test -f build/index.html || { echo "::error::build/index.html missing"; exit 1; }
          echo "built $(find build -type f | wc -l) files"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The Worker answers 200 for unknown paths (it reproduces nginx's
      # try_files ... /index.html), so a status check cannot tell a live page
      # from the fallback. Compare content instead.
      - name: Verify the deploy reached the live site
        run: |
          sleep 10
          curl -fsS https://resources.autogence.ai/            -o /tmp/home.html
          curl -fsS https://resources.autogence.ai/docs/intro/ -o /tmp/page.html || true
          if cmp -s /tmp/home.html /tmp/page.html; then
            echo "::warning::/docs/intro/ is byte-identical to the homepage — that is the SPA fallback, not a deployed page"
          fi
          test -s /tmp/home.html || { echo "::error::homepage empty"; exit 1; }
          echo "live site responded, $(stat -c%s /tmp/home.html) bytes"
