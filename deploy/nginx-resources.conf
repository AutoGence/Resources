# AutoGence Resources - nginx site config
#
# Install on the new server as:
#   /etc/nginx/sites-available/resources.autogence.ai
# then:
#   sudo ln -s /etc/nginx/sites-available/resources.autogence.ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only. Run certbot afterwards (see HANDOVER.md step 5) and it
# will rewrite this file in place to add the TLS server block and the :80 redirect.

server {
    listen 80;
    listen [::]:80;

    server_name resources.autogence.ai;

    root /var/www/resources.autogence.ai;
    index index.html;

    access_log /var/log/nginx/resources.autogence.ai.access.log;
    error_log  /var/log/nginx/resources.autogence.ai.error.log;

    # Docusaurus is a static site generator: every route is a real directory
    # containing index.html. Serve the file, then the directory, then hand off
    # to the styled 404 page. Do NOT use an SPA-style `/index.html` fallback --
    # that returns HTTP 200 for missing pages and breaks search engines.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets are immutable -- cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML must never be cached at the edge, or deploys appear not to land.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The local search plugin builds its index at compile time and fetches it
    # at runtime. It is large and changes every deploy.
    location = /search-index.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Basic hardening. The site is fully static -- no upstream, no cookies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Don't serve dotfiles if any ever end up in the web root.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
